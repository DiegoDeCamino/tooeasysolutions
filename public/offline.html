<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | Too Easy</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7f7f5; color: #1d1c1a; text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 20px 0 6px; }
      p { margin: 0 0 20px; opacity: .75; }
      button {
        font: inherit; font-weight: 500; border: 0; border-radius: 10px; padding: 11px 20px;
        background: #0b7a78; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121314; color: #ececea; }
        button { background: #33b8b5; color: #04201f; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
